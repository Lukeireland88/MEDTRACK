name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify PWA assets
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/manifest.json
          test -f dist/sw.js
          test -f dist/registerSW.js
          test -f dist/icon-192.png
          test -f dist/icon-512.png
          test -f dist/.nojekyll
          ls dist/workbox-*.js >/dev/null
          grep -q 'rel="manifest" href="/manifest.webmanifest"' dist/index.html
          grep -q 'src="/registerSW.js"' dist/index.html
          test ! -e dist/.env
          test ! -e dist/.env.local
          if ls dist/*.map dist/assets/*.map >/dev/null 2>&1; then echo "Source maps must not be deployed"; exit 1; fi
          if grep -R -E '"role"[[:space:]]*:[[:space:]]*"service_role"|SUPABASE_SERVICE_ROLE' dist --include='*.js' --include='*.html' --include='*.json' >/dev/null; then echo "Forbidden service-role marker in dist"; exit 1; fi
          if grep -R '/MEDTRACK/' dist --include='*.js' --include='*.html' --include='*.webmanifest' >/dev/null; then echo "Legacy /MEDTRACK/ path found"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
